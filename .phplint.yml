# Based on magicsunday/coding-standard's templates/phplint.yml; lints the whole
# repository (config, public and the root PHP configs included), not only src and tests.
path:
    - ./

jobs: 10

cache-dir: .build/cache/.phplint.cache

extensions:
    - php

exclude:
    - .build
    - node_modules
    - var
    - vendor
